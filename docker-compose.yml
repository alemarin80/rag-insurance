# Pinned so renaming the project folder keeps the existing pgdata volume.
name: insurance-rag-eval

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: insurance_rag_db
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: insurance_rag
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: